config-version = 2

start-at-login = true

persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7"]

[workspace-to-monitor-force-assignment]
    1 = 'main'
    2 = 'main'
    3 = 'main'
    4 = 'main'
    5 = ['secondary', 'main']
    6 = ['secondary', 'main']
    7 = ['secondary', 'main']

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 6
    inner.vertical = 6
    outer.left = 3
    outer.bottom = 3
    outer.top = 3
    outer.right = 3

[mode.main.binding]
    ctrl-alt-cmd-h = 'focus left'
    ctrl-alt-cmd-j = 'focus down'
    ctrl-alt-cmd-k = 'focus up'
    ctrl-alt-cmd-l = 'focus right'

    ctrl-alt-cmd-shift-h = 'move left'
    ctrl-alt-cmd-shift-j = 'move down'
    ctrl-alt-cmd-shift-k = 'move up'
    ctrl-alt-cmd-shift-l = 'move right'

    ctrl-alt-cmd-minus = 'resize smart -50'
    ctrl-alt-cmd-equal = 'resize smart +50'
    ctrl-alt-cmd-0 = 'balance-sizes'
    ctrl-alt-cmd-shift-f = 'fullscreen'
    ctrl-alt-cmd-shift-space = 'layout floating tiling'

    ctrl-alt-cmd-slash = 'layout tiles horizontal vertical'
    ctrl-alt-cmd-comma = 'layout accordion horizontal vertical'

    ctrl-alt-cmd-1 = 'workspace --auto-back-and-forth 1'
    ctrl-alt-cmd-2 = 'workspace --auto-back-and-forth 2'
    ctrl-alt-cmd-3 = 'workspace --auto-back-and-forth 3'
    ctrl-alt-cmd-4 = 'workspace --auto-back-and-forth 4'
    ctrl-alt-cmd-5 = 'workspace --auto-back-and-forth 5'
    ctrl-alt-cmd-6 = 'workspace --auto-back-and-forth 6'
    ctrl-alt-cmd-7 = 'workspace --auto-back-and-forth 7'
    ctrl-alt-cmd-z = 'workspace --auto-back-and-forth Z'
    ctrl-alt-cmd-tab = 'workspace-back-and-forth'
    ctrl-alt-cmd-m = 'focus-monitor --wrap-around next'

    ctrl-alt-cmd-shift-1 = 'move-node-to-workspace 1'
    ctrl-alt-cmd-shift-2 = 'move-node-to-workspace 2'
    ctrl-alt-cmd-shift-3 = 'move-node-to-workspace 3'
    ctrl-alt-cmd-shift-4 = 'move-node-to-workspace 4'
    ctrl-alt-cmd-shift-5 = 'move-node-to-workspace 5'
    ctrl-alt-cmd-shift-6 = 'move-node-to-workspace 6'
    ctrl-alt-cmd-shift-7 = 'move-node-to-workspace 7'
    ctrl-alt-cmd-shift-m = 'move-node-to-monitor --focus-follows-window --wrap-around next'

    ctrl-alt-cmd-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']

[[on-window-detected]]
    if.app-id = 'us.zoom.xos'
    run = 'move-node-to-workspace Z'

[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'
