  { key = "p", mods = "Alt|Shift", chars = "\u001b[112;4u" },
  { key = "j", mods = "Alt|Shift", chars = "\u001b[106;4u" },
  { key = "k", mods = "Alt|Shift", chars = "\u001b[107;4u" },
  { key = "c", mods = "Alt|Shift", chars = "\u001b[99;4u" },
  { key = "r", mods = "Alt|Shift", chars = "\u001b[114;4u" },
  { key = "x", mods = "Alt|Shift", chars = "\u001b[120;4u" },
