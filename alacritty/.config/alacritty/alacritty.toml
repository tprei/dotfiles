  { key = "&", mods = "Alt|Shift", chars = "\u001b[55;4u" },
  { key = "*", mods = "Alt|Shift", chars = "\u001b[56;4u" },
  { key = "(", mods = "Alt|Shift", chars = "\u001b[57;4u" },
  { key = "{", mods = "Alt|Shift", chars = "\u001b[91;4u" },
  { key = "}", mods = "Alt|Shift", chars = "\u001b[93;4u" },
  { key = "?", mods = "Alt|Shift", chars = "\u001b[47;4u" },
  { key = ">", mods = "Alt|Shift", chars = "\u001b[46;4u" },
]

[cursor]
unfocused_hollow = true
style = { shape = "Block", blinking = "Off" }

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[terminal]
shell = { program = "wsl.exe", args = ["~"] }
osc52 = "OnlyCopy"
