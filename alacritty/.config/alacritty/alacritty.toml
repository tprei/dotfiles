[general]
import = ["themes/gruvbox_dark.toml"]
live_config_reload = true

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true

[scrolling]
history = 20000
multiplier = 3

[font]
size = 18.0

[font.normal]
family = "UbuntuMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "UbuntuMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "UbuntuMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "UbuntuMono Nerd Font Mono"
style = "Bold Italic"

[keyboard]
bindings = [
  { key = "Enter", mods = "Shift", chars = "\u001b[13;2u" },
  { key = "Enter", mods = "Alt", chars = "\u001b[13;3u" },
  { key = "n", mods = "Alt", chars = "\u001b[110;3u" },
  { key = "p", mods = "Alt", chars = "\u001b[112;3u" },
  { key = "j", mods = "Alt", chars = "\u001b[106;3u" },
  { key = "k", mods = "Alt", chars = "\u001b[107;3u" },
  { key = "c", mods = "Alt", chars = "\u001b[99;3u" },
  { key = "x", mods = "Alt", chars = "\u001b[120;3u" },
  { key = "r", mods = "Alt", chars = "\u001b[114;3u" },
  { key = "z", mods = "Alt", chars = "\u001b[122;3u" },
