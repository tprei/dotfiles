providers:
  {}
symbolPreset: nerd
theme:
  dark: titanium
  light: light
setupVersion: 2
modelRoles:
  default: zai/glm-5.3:max
  slow: zai/glm-5.3:max
  plan: zai/glm-5.3:max
  advisor: opencode-go/kimi-k3:high
  task: zai/glm-5.3-flash:high
  vision: zai/glm-5.3-flash:high
  commit: opencode-go/muse-spark-1.3-contributor:minimal
  smol: opencode-go/muse-spark-1.3-contributor:minimal
  tiny: opencode-go/muse-spark-1.3-contributor:minimal
defaultThinkingLevel: auto
advisor:
  enabled: true
  syncBacklog: "off"
task:
  agentAdvisor:
    task: "on"
  disabledAgents:
    - designer
    - librarian
    - plan
    - scout
    - sonic
  agentModelOverrides:
    planner: zai/glm-5.3:max
    technical-architect: zai/glm-5.3:max
    strategist: zai/glm-5.3:max
    surveyor: zai/glm-5.3:max
    explorer: zai/glm-5.3-flash:high
    reviewer: zai/glm-5.3:max
    adversary: opencode-go/kimi-k3:high
    enemy: opencode-go/kimi-k3:high
    security-reviewer: zai/glm-5.3:max
    triage: opencode-go/muse-spark-1.3-contributor:minimal
    git-commit-specialist: opencode-go/muse-spark-1.3-contributor:minimal
    task: zai/glm-5.3-flash:high
dev:
  autoqaConsent: granted
github:
  enabled: true
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
compaction:
  handoffSaveToDisk: true
  idleEnabled: true
bash:
  patterns:
    - match: "sed -i*"
      approval: deny
    - match: "sed --in-place*"
      approval: deny
    - match: "perl -i*"
      approval: deny
    - match: "perl -pi*"
      approval: deny
    - match: "git commit -n*"
      approval: deny
    - match: "git push -f*"
      approval: deny
retry:
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  maxDelayMs: 0
  fallbackChains:
    default:
      - zai/glm-5.3-flash:high
      - opencode-go/muse-spark-1.3-contributor:high
    zai/glm-5.3:
      - opencode-go/kimi-k3:high
      - opencode-go/muse-spark-1.3-contributor:high
    zai/glm-5.3-flash:
      - opencode-go/deepseek-v4.1-flash:high
      - opencode-go/muse-spark-1.3-contributor:high
    opencode-go/kimi-k3:
      - opencode-go/muse-spark-1.3-contributor:high
      - zai/glm-5.3:max
    opencode-go/*:
      - zai/glm-5.3-flash:high
composer:
  shape: box
