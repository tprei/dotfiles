mainAgent:
  disabledProviders:
    - antigravity-cli
symbolPreset: nerd
theme:
  dark: titanium
  light: light
setupVersion: 2
modelRoles:
  default: anthropic/claude-opus-5-5:medium
  task: anthropic/claude-haiku-5-5:max
  slow: anthropic/claude-opus-5-5:xhigh
  plan: anthropic/claude-opus-5-5:xhigh
  advisor: openai-codex/gpt-6.2-sol:max
  commit: antigravity-cli/gemini-4-hydrogen:medium
  smol: anthropic/claude-haiku-5-5:max
  tiny: anthropic/claude-haiku-5-5:low
defaultThinkingLevel: auto
task:
  eager: always
  disabledAgents:
    - designer
    - librarian
    - plan
    - scout
    - sonic
  agentModelOverrides:
    task: anthropic/claude-haiku-5-5:max
    explorer: anthropic/claude-opus-5-5:xhigh
    planner: anthropic/claude-opus-5-5:xhigh
    technical-architect: anthropic/claude-opus-5-5:xhigh
    reviewer: openai-codex/gpt-6.2-sol:max
    enemy: openai-codex/gpt-6.2-sol:max
    adversary: openai-codex/gpt-6.2-sol:max
    surveyor: openai-codex/gpt-6.2-sol:xhigh
    strategist: openai-codex/gpt-6.2-sol:xhigh
    triage: anthropic/claude-haiku-5-5:max
    git-commit-specialist: antigravity-cli/gemini-4-hydrogen:medium
dev:
  autoqaConsent: granted
retry:
  modelFallback: true
  fallbackChains:
    anthropic/claude-opus-5-5:
      - antigravity-cli/claude-opus-5-5:high
      - antigravity-cli/gemini-4-neon:xhigh
      - openai-codex/gpt-6.2-sol:xhigh
      - anthropic/claude-sonnet-5-5:max
    anthropic/claude-sonnet-5-5:
      - antigravity-cli/claude-sonnet-5-5:high
      - antigravity-cli/gemini-4-neon:xhigh
      - openai-codex/gpt-6.2-sol:xhigh
    anthropic/claude-haiku-5-5:
      - antigravity-cli/gemini-4-hydrogen:high
      - zai/glm-5.3-flash:max
    openai-codex/gpt-6.2-sol:
      - anthropic/claude-opus-5-5:high
      - antigravity-cli/claude-opus-5-5:high
      - antigravity-cli/gemini-4-neon:xhigh
    zai/glm-5.3:
      - anthropic/claude-haiku-5-5:max
    antigravity-cli/*:
      - anthropic/claude-opus-5-5:high
      - openai-codex/gpt-6.2-sol:xhigh
  maxDelayMs: 0
composer:
  shape: band
