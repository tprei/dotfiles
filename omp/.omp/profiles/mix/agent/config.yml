mainAgent:
  disabledProviders:
    - antigravity-cli
disabledProviders:
  - google-antigravity
symbolPreset: unicode
theme:
  dark: titanium
  light: light
setupVersion: 2
modelRoles:
  default: anthropic/claude-opus-5:medium
  slow: anthropic/claude-opus-5:high
  plan: openai-codex/gpt-6-astra:medium
  advisor: antigravity-cli/gemini-3.8-flash:high
  task: zai/glm-5.3-flash:max
  vision: zai/glm-5.3:max
  commit: antigravity-cli/gemini-3.8-flash:medium
  smol: zai/glm-5.3:max
  tiny: zai/glm-5.3:max
defaultThinkingLevel: auto
advisor:
  enabled: true
  syncBacklog: "off"
task:
  eager: always
  disabledAgents:
    - designer
    - plan
    - sonic
  agentModelOverrides:
    planner: openai-codex/gpt-6-astra:medium
    technical-architect: openai-codex/gpt-6-astra:medium
    strategist: zai/glm-5.3:max
    surveyor: antigravity-cli/gemini-3.8-flash:high
    explorer: zai/glm-5.3-flash:max
    librarian: zai/glm-5.3-flash:max
    scout: zai/glm-5.3-flash:max
    reviewer: openai-codex/gpt-5.6-sol:high
    adversary: antigravity-cli/gemini-3.8-flash:high
    enemy: anthropic/claude-opus-5:high
    security-reviewer: zai/glm-5.3:max
    triage: zai/glm-5.3:max
    git-commit-specialist: antigravity-cli/gemini-3.8-flash:medium
    task: zai/glm-5.3-flash:max
    ui-implementer: zai/glm-5.3-flash:max
  enableLsp: true
dev:
  autoqaConsent: granted
edit:
  mode: hashline
retry:
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  maxDelayMs: 300000
  fallbackChains:
    default:
      - zai/glm-5.3-flash:max
    anthropic/claude-opus-5:
      - anthropic/claude-fable-5-1:high
      - zai/glm-5.3:max
    anthropic/claude-fable-5-1:
      - anthropic/claude-opus-5:high
      - zai/glm-5.3:max
    openai-codex/gpt-6-astra:
      - openai-codex/gpt-5.6-sol:high
      - zai/glm-5.3:max
    openai-codex/gpt-5.6-sol:
      - anthropic/claude-opus-5:high
      - zai/glm-5.3:max
    openai-codex/gpt-5.6-luna:
      - antigravity-cli/gemini-3.8-flash:high
      - openrouter/meta/muse-spark-1.3-contributor:max
      - zai/glm-5.3-flash:max
    zai/glm-5.3:
      - openrouter/meta/muse-spark-1.3-contributor:max
      - opencode-go/muse-spark-1.3-contributor:high
    zai/glm-5.3-flash:
      - antigravity-cli/gemini-3.8-flash:high
      - openrouter/meta/muse-spark-1.3-contributor:max
      - opencode-go/muse-spark-1.3-contributor:medium
    antigravity-cli/*:
      - zai/glm-5.3:max
    opencode-go/*:
      - antigravity-cli/gemini-3.8-flash:high
      - zai/glm-5.3-flash:max
composer:
  shape: box
codexResets:
  autoRedeem: "yes"
