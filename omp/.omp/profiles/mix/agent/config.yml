# mix = literal cross-family mix, four tiers:
#  - orchestrator/deep-reasoning (default/slow/plan, planner/technical-architect): opus-5, capped at :medium
#  - fast implementer (task role + task subagent): glm-5.2:high
#  - deep audit gatekeepers (adversary/enemy/reviewer): sonnet-5
#    advisor watchdog: openrouter deepseek-v4-flash-0731 (fast/cheap
#    reviewer of every GLM-5.2 turn)
#  - cheap/fast subagents: glm-5-turbo for read-only research (explorer/
#    scout/librarian), haiku-4-5 for trivial mechanical work (triage/
#    git-commit-specialist)
#  - strategist/surveyor deliberately stay on glm-5.2:xhigh: a genuine
#    second opinion needs a different model family than the primary
#    opus-5 planner, not just a smaller one
# Plan-yolo is armed by the `mix` alias
# (`--plan-yolo --plan-yolo-into=zai/glm-5.2:high`), not a settings key.
#
# NOTE: comments do not survive in-app /settings writes (this file lost
# its prior header once before). If it looks stale, check `omp config
# get modelRoles` against this file's actual content.

symbolPreset: unicode
theme: 
  dark: titanium
  light: light
setupVersion: 1
modelRoles: 
  default: anthropic/claude-opus-5:medium
  slow: anthropic/claude-opus-5:medium
  plan: anthropic/claude-opus-5:medium
  advisor: openrouter/deepseek/deepseek-v4-flash-0731
  task: zai/glm-5.2:high
  commit: anthropic/claude-haiku-4-5:minimal
  smol: anthropic/claude-haiku-4-5:minimal
  tiny: anthropic/claude-haiku-4-5:minimal
defaultThinkingLevel: auto
advisor: 
  enabled: true
  syncBacklog: "off"
task: 
  eager: always
  disabledAgents: 
    - designer
    - plan
    - sonic
  agentModelOverrides: 
    adversary: anthropic/claude-sonnet-5:max
    enemy: anthropic/claude-sonnet-5:max
    explorer: zai/glm-5-turbo
    git-commit-specialist: anthropic/claude-haiku-4-5:minimal
    planner: anthropic/claude-opus-5:medium
    strategist: zai/glm-5.2:xhigh
    surveyor: zai/glm-5.2:xhigh
    technical-architect: anthropic/claude-opus-5:medium
    triage: anthropic/claude-haiku-4-5:minimal
    librarian: zai/glm-5-turbo
    reviewer: openrouter/openai/gpt-5.6-luna:max
    scout: zai/glm-5-turbo
    task: zai/glm-5.2:high
dev: 
  autoqaConsent: granted