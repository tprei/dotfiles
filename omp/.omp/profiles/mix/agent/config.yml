symbolPreset: unicode
theme:
  dark: titanium
  light: light
setupVersion: 2
modelRoles:
  default: anthropic/claude-opus-5:medium
  slow: anthropic/claude-opus-5:high
  plan: openai-codex/gpt-6-astra:medium
  advisor: zai/glm-5.3:max
  task: zai/glm-5.3-flash:high
  vision: antigravity-cli/gemini-3.8-flash:medium
  commit: antigravity-cli/gemini-3.8-flash:minimal
  smol: antigravity-cli/gemini-3.8-flash:minimal
  tiny: antigravity-cli/gemini-3.8-flash:minimal
defaultThinkingLevel: auto
advisor:
  enabled: true
  syncBacklog: "off"
task:
  eager: always
  disabledAgents:
    - designer
    - plan
    - sonic
  agentModelOverrides:
    planner: openai-codex/gpt-6-astra:medium
    technical-architect: openai-codex/gpt-6-astra:medium
    strategist: zai/glm-5.3:max
    surveyor: zai/glm-5.3:max
    explorer: zai/glm-5.3-flash:high
    librarian: zai/glm-5.3-flash:high
    scout: zai/glm-5.3-flash:high
    reviewer: openai-codex/gpt-5.6-sol:high
    adversary: zai/glm-5.3:max
    enemy: anthropic/claude-opus-5:high
    security-reviewer: zai/glm-5.3:max
    triage: antigravity-cli/gemini-3.8-flash:minimal
    git-commit-specialist: antigravity-cli/gemini-3.8-flash:minimal
    task: zai/glm-5.3-flash:high
dev:
  autoqaConsent: granted
edit:
  mode: hashline
retry:
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  maxDelayMs: 0
  fallbackChains:
    default:
      - zai/glm-5.3-flash:high
      - google-antigravity/gemini-3.8-flash:high
      - google-antigravity/claude-opus-4-6:high
    anthropic/claude-opus-5:
      - anthropic/claude-fable-5-1:high
      - zai/glm-5.3:max
    anthropic/claude-fable-5-1:
      - anthropic/claude-opus-5:high
      - zai/glm-5.3:max
    openai-codex/gpt-6-astra:
      - openai-codex/gpt-5.6-sol:high
      - zai/glm-5.3:max
    openai-codex/gpt-5.6-sol:
      - anthropic/claude-opus-5:high
      - zai/glm-5.3:max
    openai-codex/gpt-5.6-luna:
      - openrouter/meta/muse-spark-1.3-contributor:max
      - zai/glm-5.3-flash:high
    zai/glm-5.3:
      - openrouter/meta/muse-spark-1.3-contributor:max
      - google-antigravity/claude-opus-4-6:high
      - opencode-go/muse-spark-1.3-contributor:high
    zai/glm-5.3-flash:
      - openrouter/meta/muse-spark-1.3-contributor:max
      - opencode-go/muse-spark-1.3-contributor:medium
      - antigravity-cli/gemini-3.8-flash:high
      - google-antigravity/claude-opus-4-6:high
    antigravity-cli/gemini-3.8-flash:
      - openrouter/meta/muse-spark-1.3-contributor:max
      - zai/glm-5.3-flash:high
      - opencode-go/deepseek-v4.1-flash:high
    google-antigravity/*:
      - anthropic/*
    antigravity-cli/*:
      - anthropic/*
    opencode-go/*:
      - zai/glm-5.3-flash:high
      - antigravity-cli/gemini-3.8-flash:high
composer:
  shape: box
codexResets:
  autoRedeem: "yes"
