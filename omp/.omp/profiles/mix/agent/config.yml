mainAgent:
  disabledProviders:
    - antigravity-cli
disabledProviders:
  - google-antigravity
symbolPreset: unicode
theme:
  dark: titanium
  light: light
setupVersion: 2
modelRoles:
  default: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-opus-5-5:high
  plan: openai-codex/gpt-6.2-sol:xhigh
  advisor: antigravity-cli/gemini-4-hydrogen:high
  task: zai/glm-5.3-flash:max
  vision: zai/glm-5.4:max
  commit: antigravity-cli/gemini-4-hydrogen:medium
  smol: zai/glm-5.4:max
  tiny: zai/glm-5.4:max
defaultThinkingLevel: auto
advisor:
  enabled: true
  syncBacklog: "off"
task:
  eager: always
  disabledAgents:
    - designer
    - plan
    - sonic
  agentModelOverrides:
    planner: openai-codex/gpt-6.2-sol:xhigh
    technical-architect: openai-codex/gpt-6.2-sol:xhigh
    strategist: zai/glm-5.4:max
    surveyor: antigravity-cli/gemini-4-hydrogen:high
    explorer: zai/glm-5.3-flash:max
    librarian: zai/glm-5.3-flash:max
    scout: zai/glm-5.3-flash:max
    reviewer: openai-codex/gpt-6.2-sol:xhigh
    enemy: anthropic/claude-opus-5-5:medium
    security-reviewer: zai/glm-5.4:max
    triage: zai/glm-5.4:max
    git-commit-specialist: antigravity-cli/gemini-4-hydrogen:medium
    task: zai/glm-5.3-flash:max
    ui-implementer: zai/glm-5.3-flash:max
    ui-designer: openai-codex/gpt-6.2-sol:xhigh
  enableLsp: true
dev:
  autoqaConsent: granted
edit:
  mode: hashline
retry:
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  maxDelayMs: 300000
  fallbackChains:
    default:
      - zai/glm-5.3-flash:max
    anthropic/claude-opus-5-5:
      - zai/glm-5.4:max
    anthropic/claude-fable-5-2:
      - anthropic/claude-opus-5-5:high
      - zai/glm-5.4:max
    openai-codex/gpt-6.2-sol:
      - anthropic/claude-opus-5-5:medium
      - zai/glm-5.4:max
    openai-codex/gpt-6-luna:
      - antigravity-cli/gemini-4-hydrogen:high
      - openrouter/meta/muse-spark-1.3-contributor:max
      - zai/glm-5.3-flash:max
    zai/glm-5.4:
      - openrouter/meta/muse-spark-1.3-contributor:max
      - opencode-go/muse-spark-1.3-contributor:high
    zai/glm-5.3-flash:
      - antigravity-cli/gemini-4-hydrogen:high
      - openrouter/meta/muse-spark-1.3-contributor:max
      - opencode-go/muse-spark-1.3-contributor:medium
    antigravity-cli/*:
      - zai/glm-5.4:max
      - openai-codex/gpt-6-luna:max
    opencode-go/*:
      - antigravity-cli/gemini-4-hydrogen:high
      - zai/glm-5.3-flash:max
composer:
  shape: box
codexResets:
  autoRedeem5h: "no"
  autoRedeemWeekly: "no"
