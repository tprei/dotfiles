mainAgent:
  disabledProviders:
    - antigravity-cli
disabledProviders:
  - google-antigravity
symbolPreset: nerd
theme:
  dark: titanium
  light: light
setupVersion: 2
modelRoles:
  default: zai/glm-5.3:max
  slow: anthropic/claude-opus-5-5:high
  plan: openai-codex/gpt-6.2-sol:xhigh
  advisor: antigravity-cli/gemini-4-hydrogen:high
  task: anthropic/claude-haiku-5-5:max
  vision: zai/glm-5.3-flash:max
  commit: antigravity-cli/gemini-4-hydrogen:medium
  smol: zai/glm-5.3:max
  tiny: zai/glm-5.3:max
defaultThinkingLevel: auto
advisor:
  enabled: true
  syncBacklog: "off"
task:
  eager: always
  disabledAgents:
    - designer
    - librarian
    - plan
    - scout
    - sonic
  agentModelOverrides:
    planner: openai-codex/gpt-6.2-sol:xhigh
    technical-architect: openai-codex/gpt-6.2-sol:xhigh
    strategist: zai/glm-5.3:max
    surveyor: antigravity-cli/gemini-4-hydrogen:high
    explorer: zai/glm-5.3-flash:max
    reviewer: openai-codex/gpt-6.2-sol:xhigh
    enemy: anthropic/claude-opus-5-5:medium
    security-reviewer: openai-codex/gpt-6.2-sol:xhigh
    triage: anthropic/claude-haiku-5-5:max
    git-commit-specialist: antigravity-cli/gemini-4-hydrogen:medium
    task: anthropic/claude-haiku-5-5:max
    ui-implementer: anthropic/claude-haiku-5-5:max
    ui-designer: openai-codex/gpt-6.2-sol:xhigh
  enableLsp: true
dev:
  autoqaConsent: granted
retry:
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  maxDelayMs: 300000
  fallbackChains:
    default:
      - anthropic/claude-haiku-5-5:max
      - zai/glm-5.3-flash:max
    zai/glm-5.3: []
    zai/glm-5.3-flash:
      - anthropic/claude-haiku-5-5:max
      - antigravity-cli/gemini-4-hydrogen:high
    anthropic/claude-opus-5-5:
      - antigravity-cli/claude-opus-5-5:high
      - antigravity-cli/gemini-4-neon:xhigh
      - openai-codex/gpt-6.2-sol:xhigh
      - openai-codex/gpt-6.2-astra:low
    anthropic/claude-fable-5-2:
      - anthropic/claude-opus-5-5:high
      - antigravity-cli/claude-opus-5-5:high
      - antigravity-cli/gemini-4-neon:xhigh
      - openai-codex/gpt-6.2-sol:xhigh
    anthropic/claude-haiku-5-5:
      - zai/glm-5.3-flash:max
      - antigravity-cli/gemini-4-hydrogen:high
    openai-codex/gpt-6.2-sol:
      - anthropic/claude-opus-5-5:high
      - antigravity-cli/gemini-4-neon:xhigh
    openai-codex/gpt-6.2-astra:
      - antigravity-cli/gemini-4-neon:xhigh
      - anthropic/claude-opus-5-5:high
      - antigravity-cli/claude-opus-5-5:high
      - openai-codex/gpt-6.2-sol:xhigh
    openai-codex/gpt-6-luna:
      - anthropic/claude-haiku-5-5:max
      - zai/glm-5.3-flash:max
    antigravity-cli/claude-opus-5-5:
      - anthropic/claude-opus-5-5:high
      - antigravity-cli/gemini-4-neon:xhigh
      - openai-codex/gpt-6.2-sol:xhigh
    antigravity-cli/gemini-4-neon:
      - anthropic/claude-opus-5-5:medium
      - antigravity-cli/claude-opus-5-5:high
      - openai-codex/gpt-6.2-sol:xhigh
    antigravity-cli/*:
      - anthropic/claude-haiku-5-5:max
      - zai/glm-5.3-flash:max
    opencode-go/glm-5.3:
      - zai/glm-5.3:max
    opencode-go/glm-5.3-flash:
      - zai/glm-5.3-flash:max
    opencode-go/*:
      - antigravity-cli/gemini-4-hydrogen:high
      - zai/glm-5.3-flash:max
  maxRetries: 20
hideThinkingBlock: true
composer:
  shape: box
codexResets:
  autoRedeem5h: "no"
  autoRedeemWeekly: "no"