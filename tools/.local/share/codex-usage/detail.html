<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>OMP usage</title>
<style>
  :root {
    --page: #000000;
    --cell: #1C1C1E;
    --raised: #2C2C2E;
    --label: #FFFFFF;
    --secondary: rgba(235, 235, 245, 0.6);
    --tertiary: rgba(235, 235, 245, 0.3);
    --separator: rgba(84, 84, 88, 0.55);
    --heat: #FF9F0A;
    --empty: #FF453A;
    --amber: #FFD60A;
    --tint: #0A84FF;
    --segment-track: rgba(118, 118, 128, 0.24);
    --segment-on: #636366;
    --segment-shadow: 0 3px 8px rgba(0, 0, 0, 0.24);
    --bar-glass: rgba(0, 0, 0, 0.78);
    --rainbow: linear-gradient(135deg, #FF453A, #FF9F0A, #FFD60A, #30D158, #0A84FF, #BF5AF2);
    --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    --figure: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --gutter: max(16px, env(safe-area-inset-left));
    --gutter-end: max(16px, env(safe-area-inset-right));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { overscroll-behavior-y: none; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--page);
    color: var(--label);
    font: 17px/1.35 var(--text);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  ::selection { background: color-mix(in srgb, var(--tint) 28%, transparent); }
  :focus-visible { outline: 3px solid var(--tint); outline-offset: 2px; border-radius: 8px; }
  button { font: inherit; color: inherit; }
  .shell { max-width: 640px; margin: 0 auto; }

  .pull {
    height: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: var(--secondary);
  }
  .pull svg { width: 28px; height: 28px; }
  .pull.refreshing svg { animation: spin 0.9s steps(8) infinite; }
  .settle { transition: height 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes spin { to { transform: rotate(360deg); } }

  header {
    padding: calc(env(safe-area-inset-top) + 20px) var(--gutter-end) 0 var(--gutter);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: 0.01em; }
  .refresh {
    width: 44px;
    height: 44px;
    margin-right: -8px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--tint);
    cursor: pointer;
  }
  .refresh:hover { background: var(--segment-track); }
  .refresh:active { opacity: 0.5; }
  .refresh svg { width: 22px; height: 22px; }
  .refresh[aria-busy="true"] svg { animation: spin 0.9s linear infinite; }
  .status { margin: 2px 0 0; min-height: 20px; font-size: 15px; color: var(--secondary); display: flex; align-items: center; gap: 6px; }
  .status.warn { color: var(--amber); font-weight: 600; }
  .status svg { width: 16px; height: 16px; flex: none; }

  nav {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 12px var(--gutter-end) 12px var(--gutter);
    background: var(--bar-glass);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
  }
  .segments {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding: 2px;
    border-radius: 10px;
    background: var(--segment-track);
  }
  .segments a {
    min-height: 32px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    color: var(--label);
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    transition: background-color 0.2s, box-shadow 0.2s;
  }
  .segments a[aria-current="page"] { background: var(--segment-on); box-shadow: var(--segment-shadow); font-weight: 600; }

  main { padding: 8px var(--gutter-end) calc(env(safe-area-inset-bottom) + 40px) var(--gutter); }
  section[hidden] { display: none; }
  h2 {
    margin: 32px 4px 10px;
    font-size: 15px;
    font-weight: 600;
    color: var(--secondary);
  }
  .cell {
    position: relative;
    background: var(--cell);
    border-radius: 20px;
    padding: 18px;
  }
  .cell + .cell, .cell + .list { margin-top: 12px; }
  .opportunity {
    border: 2px solid transparent;
    background: linear-gradient(var(--cell), var(--cell)) padding-box, var(--rainbow) border-box;
    padding: 16px;
  }
  .list { background: var(--cell); border-radius: 20px; overflow: hidden; }
  .list > .row + .row::before {
    content: "";
    position: absolute;
    top: 0;
    left: 60px;
    right: 0;
    border-top: 0.5px solid var(--separator);
  }
  .row { position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 14px; padding: 14px 16px; align-items: start; }

  .logo { width: 26px; height: 26px; display: block; color: var(--label); }
  .monogram {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--raised);
    color: var(--label);
    font: 700 15px/1 var(--figure);
  }
  .flame { width: 16px; height: 16px; flex: none; color: var(--heat); }
  .flame.out { color: var(--empty); }

  .who { display: flex; align-items: baseline; gap: 6px; min-width: 0; flex: 1 1 auto; overflow: hidden; }
  .who .name { font-weight: 600; white-space: nowrap; }
  .who .label { color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .who .flame { align-self: center; }
  .line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-width: 0; }
  .figure { font-family: var(--figure); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .figure small { font: 600 15px/1 var(--text); color: var(--secondary); margin-left: 5px; }
  .unknown { color: var(--secondary); font-size: 15px; white-space: nowrap; }
  .meta { margin: 7px 0 0; font-size: 15px; color: var(--secondary); text-wrap: pretty; }
  .meta.danger { color: var(--empty); font-weight: 500; }
  .meta.warn { color: var(--heat); font-weight: 500; }

  .bar { position: relative; height: 6px; margin-top: 9px; border-radius: 3px; background: color-mix(in srgb, var(--c) 22%, transparent); overflow: hidden; }
  .bar span { position: absolute; inset: 0 auto 0 0; min-width: 6px; border-radius: 3px; background: var(--c); }
  .bar .ghost { opacity: 0.42; }

  .provider { display: grid; grid-template-columns: 88px minmax(0, 1fr); column-gap: 18px; align-items: start; }
  .rings { width: 88px; height: 88px; display: block; }
  .provider .title { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; font-size: 20px; font-weight: 700; line-height: 1.2; }
  .provider .title .flame { width: 18px; height: 18px; }
  .win + .win { margin-top: 16px; }
  .win .name { font-weight: 600; }
  .win .figure { font-size: 20px; line-height: 1; }

  .forecast .headline { margin-top: 14px; }
  .forecast .headline .figure { font-size: 34px; line-height: 1; }
  .timeline { position: relative; margin-top: 16px; }
  .timeline .bar { height: 8px; margin-top: 0; border-radius: 4px; }
  .timeline .bar span { border-radius: 4px; }
  .timeline .track { position: relative; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--c) 22%, transparent); }
  .timeline .seg { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; }
  .timeline .usable { min-width: 8px; background: var(--c); }
  .timeline .dry { right: 0; background: var(--empty); }
  .timeline .knob {
    position: absolute;
    top: 50%;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: var(--label);
    box-shadow: 0 0 0 3px var(--cell);
  }
  .timeline .ends { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 13px; color: var(--secondary); }

  .session .topic { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .session .age { color: var(--secondary); font-size: 15px; white-space: nowrap; }
  .session .detail { display: flex; justify-content: space-between; gap: 12px; margin-top: 2px; font-size: 15px; color: var(--secondary); }
  .session .detail .facts { display: flex; gap: 10px; min-width: 0; overflow: hidden; }
  .session .detail .facts span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session .detail .facts span:first-child { flex: none; max-width: 60%; }
  .session .detail .facts span + span { color: var(--tertiary); }
  .session .tokens { white-space: nowrap; }

  .note { margin: 14px 4px 0; font-size: 15px; color: var(--secondary); text-wrap: pretty; }
  .empty { padding: 28px 18px; text-align: center; }
  .empty strong { display: block; font-size: 17px; }
  .empty p { margin: 6px 0 0; font-size: 15px; color: var(--secondary); }
  .action {
    margin-top: 16px;
    min-height: 44px;
    padding: 0 20px;
    border: 0;
    border-radius: 12px;
    background: var(--tint);
    color: #FFFFFF;
    font-weight: 600;
    cursor: pointer;
  }
  .action:active { opacity: 0.7; }
  .loading { display: grid; justify-items: center; gap: 12px; padding: 48px 0; color: var(--secondary); font-size: 15px; }
  .loading svg { width: 28px; height: 28px; animation: spin 0.9s steps(8) infinite; }
  @media (prefers-reduced-motion: reduce) {
    .pull.refreshing svg, .refresh[aria-busy="true"] svg, .loading svg { animation: none; }
    .settle, .segments a { transition: none; }
  }
</style>
</head>

<script>
"use strict";

const MINUTE_MS = 60 * 1000;
const HOUR_MS = 60 * MINUTE_MS;
const DAY_MS = 24 * HOUR_MS;
const STALE_MS = 20 * MINUTE_MS;
const POLL_MS = 5 * MINUTE_MS;
const PULL_TRIGGER = 64;
const PULL_MAX = 110;
const FETCH_TIMEOUT_MS = 15 * 1000;
const CACHE_KEY = "omp-usage-feed";
const VIEWS = ["now", "forecast", "recent"];
const PROVIDERS = new Map([
  ["openai-codex", { name: "Codex", logo: "openai", tint: "#F2F2F7" }],
  ["openai", { name: "OpenAI", logo: "openai", tint: "#F2F2F7" }],
  ["anthropic", { name: "Claude", logo: "anthropic", tint: "#D97757" }],
  ["google-antigravity", { name: "Antigravity", logo: "google", tint: "#3186FF" }],
  ["antigravity-cli", { name: "Antigravity", logo: "google", tint: "#3186FF" }],
  ["opencode-go", { name: "OpenCode", logo: "opencode", tint: "#AEAEB2" }],
  ["zai", { name: "ZAI", logo: "zai", tint: "#8E93B8" }],
  ["openrouter", { name: "OpenRouter", logo: null, tint: "#8E8E93" }],
]);
const SVG_NS = "http://www.w3.org/2000/svg";
const state = { feed: null, offline: false, failure: null, loading: false };

function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key === "style") node.style.cssText = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) if (child !== null && child !== undefined && child !== false) node.append(child);
  return node;
}

function symbol(id, className, label) {
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", className);
  if (label) {
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", label);
  } else {
    svg.setAttribute("aria-hidden", "true");
  }
  const use = document.createElementNS(SVG_NS, "use");
  use.setAttribute("href", `#${id}`);
  svg.append(use);
  return svg;
}

function providerName(provider) {
  const known = PROVIDERS.get(provider);
  if (known) return known.name;
  return provider.split(/[-_]/).map((word) => word.charAt(0).toUpperCase() + word.slice(1)).join(" ");
}

function ownerName(entry) {
  const name = providerName(entry.provider);
  return entry.account ? `${name} ${entry.account}` : name;
}

function logo(provider) {
  const known = PROVIDERS.get(provider);
  if (known && known.logo) return symbol(`logo-${known.logo}`, "logo");
  return h("span", { class: "monogram", "aria-hidden": "true", text: providerName(provider).charAt(0).toUpperCase() });
}

function tint(provider) {
  const known = PROVIDERS.get(provider);
  return known ? known.tint : "#8E8E93";
}

function modelName(model) {
  return model.replace(/-\d{8}$/, "");
}

function clock(ms) {
  const date = new Date(ms);
  const today = new Date();
  const start = (moment) => new Date(moment.getFullYear(), moment.getMonth(), moment.getDate()).getTime();
  const days = Math.round((start(date) - start(today)) / DAY_MS);
  const time = `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
  if (days === 0) return time;
  if (days > -7 && days < 7) return `${date.toLocaleDateString("en-US", { weekday: "short" })} ${time}`;
  return date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

function duration(ms) {
  const minutes = Math.max(1, Math.round(ms / MINUTE_MS));
  if (minutes < 60) return `${minutes}m`;
  const hours = Math.floor(minutes / 60);
  if (hours < 48) return minutes % 60 ? `${hours}h ${minutes % 60}m` : `${hours}h`;
  const days = Math.floor(hours / 24);
  return hours % 24 ? `${days}d ${hours % 24}h` : `${days}d`;
}

function age(ms) {
  const minutes = Math.max(1, Math.round(ms / MINUTE_MS));
  if (minutes < 60) return `${minutes}m`;
  const hours = Math.round(minutes / 60);
  return hours < 48 ? `${hours}h` : `${Math.round(hours / 24)}d`;
}

function percent(used) {
  if (used >= 99.95) return "100%";
  if (used > 0 && used < 1) return "<1%";
  return `${Math.floor(used)}%`;
}

function tokens(value) {
  if (value >= 1_000_000) return `${(value / 1_000_000).toFixed(value >= 10_000_000 ? 0 : 1)}M tokens`;
  if (value >= 1_000) return `${Math.round(value / 1_000)}K tokens`;
  return `${value} tokens`;
}

function isOut(entry) {
  return entry.state === "exhausted" || (entry.used !== null && entry.used >= 99.95);
}

function runsDry(entry) {
  return entry.cutoff_ms !== null && (entry.reset_ms === null || entry.cutoff_ms < entry.reset_ms);
}

function stateColor(entry) {
  if (isOut(entry)) return "var(--empty)";
  return entry.signal === "hot" ? "var(--heat)" : tint(entry.provider);
}

function figureColor(entry) {
  if (isOut(entry)) return "var(--empty)";
  return entry.signal === "hot" ? "var(--heat)" : "var(--label)";
}

function providerGroups(windows) {
  const owners = new Map();
  for (const entry of windows) {
    if (entry.used === null) continue;
    const key = `${entry.provider}/${entry.account}`;
    if (!owners.has(key)) owners.set(key, []);
    owners.get(key).push(entry);
  }
  return [...owners.values()].map((all) => {
    const hot = all.some((entry) => entry.signal === "hot");
    const chance = hot ? null : all.find((entry) => entry.signal === "opportunity") || null;
    const focus = chance || all[0];
    const rest = all.filter((entry) => entry !== focus);
    return { provider: focus.provider, focus, second: rest[0] || null, all: [focus, ...rest], hot, chance: chance !== null };
  });
}

function forecast(entry, now) {
  const reset = entry.reset_ms;
  const cutoff = entry.cutoff_ms;
  if (isOut(entry)) return { kind: "out", cutoff: now, reset };
  if (cutoff !== null && (reset === null || cutoff < reset)) return { kind: "short", cutoff, reset };
  if (reset === null) return null;
  if (entry.projected !== null) return { kind: "lasts", cutoff: null, reset };
  return { kind: "reset", cutoff: null, reset };
}

function headline(plan, entry, now) {
  switch (plan.kind) {
    case "out":
      return plan.reset !== null ? [duration(plan.reset - now), "until it's back"] : ["Out", "no reset reported"];
    case "short":
      return plan.reset !== null ? [duration(plan.reset - plan.cutoff), `dry from ${clock(plan.cutoff)}`] : [duration(plan.cutoff - now), "until it runs out"];
    case "lasts":
      return [`~${Math.round(entry.projected)}%`, `used by ${clock(plan.reset)}`];
    default:
      return [duration(plan.reset - now), "until reset"];
  }
}

function headlineColor(plan) {
  if (plan.kind === "out") return "var(--empty)";
  return plan.kind === "short" ? "var(--heat)" : "var(--label)";
}

function verdict(entry, now) {
  if (isOut(entry)) return entry.reset_ms !== null ? `Back at ${clock(entry.reset_ms)}, in ${duration(entry.reset_ms - now)}` : "Out of quota";
  if (entry.cutoff_ms !== null && (entry.reset_ms === null || entry.cutoff_ms < entry.reset_ms)) {
    const early = entry.reset_ms !== null ? `, ${duration(entry.reset_ms - entry.cutoff_ms)} before reset` : "";
    return `Runs out ${clock(entry.cutoff_ms)}${early}`;
  }
  if (entry.reset_ms === null) return "";
  const pace = entry.projected !== null ? `, ~${Math.round(entry.projected)}% by then` : "";
  return `Resets ${clock(entry.reset_ms)}${pace}`;
}

function figure(value, unit, color) {
  return h("span", { class: "figure", style: `color:${color}` }, value, unit ? h("small", { text: unit }) : null);
}

function flame(entry) {
  return symbol("icon-flame", isOut(entry) ? "flame out" : "flame", "Heavy use");
}

function who(entry) {
  return h("div", { class: "who" },
    h("span", { class: "name", text: ownerName(entry) }),
    h("span", { class: "label", text: entry.short }),
    entry.signal === "hot" ? flame(entry) : null);
}

function bar(entry) {
  const used = Math.min(100, Math.max(0, entry.used));
  const node = h("div", { class: "bar", role: "img", "aria-label": `${percent(entry.used)} used`, style: `--c:${stateColor(entry)}` });
  if (entry.projected !== null && entry.projected > used) node.append(h("span", { class: "ghost", style: `width:${Math.min(100, entry.projected)}%` }));
  if (used > 0) node.append(h("span", { style: `width:${used}%` }));
  return node;
}

function meta(entry, now) {
  const line = verdict(entry, now);
  if (!line) return null;
  let tone = "meta";
  if (isOut(entry)) tone = "meta danger";
  else if (runsDry(entry)) tone = "meta warn";
  return h("p", { class: tone, text: line });
}

function shape(tag, attrs) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  return node;
}

function rings(group) {
  const size = 88;
  const center = size / 2;
  const node = shape("svg", {
    class: "rings",
    viewBox: `0 0 ${size} ${size}`,
    role: "img",
    "aria-label": `${providerName(group.provider)} ${group.focus.short} ${percent(group.focus.used)} used`,
  });
  let width = 10;
  let radius = center - width / 2;
  let hole = radius - width / 2;
  for (const entry of [group.focus, group.second]) {
    if (!entry) break;
    const around = 2 * Math.PI * radius;
    const used = Math.min(100, Math.max(0, entry.used)) / 100;
    const stroke = `stroke:${stateColor(entry)}`;
    node.append(shape("circle", { cx: center, cy: center, r: radius, fill: "none", "stroke-width": width, "stroke-opacity": 0.22, style: stroke }));
    if (used > 0) {
      node.append(shape("circle", {
        cx: center,
        cy: center,
        r: radius,
        fill: "none",
        "stroke-width": width,
        "stroke-linecap": "round",
        "stroke-dasharray": `${Math.max(used, 0.015) * around} ${around}`,
        transform: `rotate(-90 ${center} ${center})`,
        style: stroke,
      }));
    }
    hole = radius - width / 2;
    const next = width - 2;
    radius = hole - 3 - next / 2;
    width = next;
  }
  const side = Math.min((hole - 4) * 1.36, size * 0.4);
  const known = PROVIDERS.get(group.provider);
  if (known && known.logo) {
    node.append(shape("use", { href: `#logo-${known.logo}`, x: center - side / 2, y: center - side / 2, width: side, height: side, style: "color:#FFFFFF" }));
  } else {
    const letter = shape("text", { x: center, y: center + side * 0.3, "text-anchor": "middle", "font-size": side * 0.8, "font-weight": 700, fill: "#FFFFFF" });
    letter.textContent = providerName(group.provider).charAt(0).toUpperCase();
    node.append(letter);
  }
  return node;
}

function windowBlock(entry, now) {
  return h("div", { class: "win" },
    h("div", { class: "line" },
      h("span", { class: "name", text: entry.short }),
      figure(percent(entry.used), null, figureColor(entry))),
    bar(entry),
    meta(entry, now));
}

function providerCard(group, now) {
  return h("article", { class: group.chance ? "cell provider opportunity" : "cell provider" },
    rings(group),
    h("div", null,
      h("div", { class: "title" }, h("span", { text: ownerName(group.focus) }), group.hot ? flame(group.focus) : null),
      ...group.all.map((entry) => windowBlock(entry, now))));
}

function unknownRow(entry) {
  return h("div", { class: "row" },
    logo(entry.provider),
    h("div", { class: "line" }, who(entry), h("span", { class: "unknown", text: "Limit unknown" })));
}

function emptyCell(title, detail) {
  return h("div", { class: "cell empty" }, h("strong", { text: title }), detail ? h("p", { text: detail }) : null);
}

function nowPanel(feed, now) {
  const windows = feed.windows;
  if (!windows.length) return [emptyCell("No quota windows yet", "Limits show up after the next usage check.")];
  const groups = providerGroups(windows);
  const unknown = windows.filter((entry) => entry.used === null);
  return [
    groups.length ? null : emptyCell("No provider reports a limit", "Token counts still arrive for these providers."),
    ...groups.map((group) => providerCard(group, now)),
    unknown.length ? h("div", { class: "list" }, ...unknown.map((entry) => unknownRow(entry))) : null,
  ];
}

function ends(left, right) {
  return h("div", { class: "ends", "aria-hidden": "true" }, h("span", { text: left }), h("span", { text: right }));
}

function timeline(plan, entry, now) {
  if (plan.kind !== "short" && plan.kind !== "out") {
    return h("div", { class: "timeline" }, bar(entry), ends(`${percent(entry.used)} used`, `Resets ${clock(plan.reset)}`));
  }
  const end = plan.reset !== null ? plan.reset : plan.cutoff;
  const span = Math.max(end - now, 1);
  const cut = plan.kind === "out" ? 0 : (Math.min(Math.max(plan.cutoff - now, 0), span) / span) * 100;
  const track = h("div", { class: "track" });
  if (plan.reset !== null) track.append(h("span", { class: "seg dry" }));
  if (cut > 0) track.append(h("span", { class: "seg usable", style: `width:${cut}%` }));
  if (plan.kind === "short") track.append(h("span", { class: "knob", style: `left:${cut}%` }));
  let finish = "No reset reported";
  if (plan.reset !== null) finish = `${plan.kind === "out" ? "Back" : "Resets"} ${clock(plan.reset)}`;
  else if (plan.kind === "short") finish = `Out ${clock(plan.cutoff)}`;
  let summary = `Out now, ${finish.toLowerCase()}`;
  if (plan.kind === "short") summary = plan.reset !== null ? `Runs out ${clock(plan.cutoff)}, resets ${clock(plan.reset)}` : `Runs out ${clock(plan.cutoff)}`;
  return h("div", { class: "timeline", role: "img", "aria-label": summary, style: `--c:${tint(entry.provider)}` },
    track,
    ends(plan.kind === "out" ? "Out now" : "Now", finish));
}

function forecastCell(item, now) {
  const [value, caption] = headline(item.plan, item.entry, now);
  return h("article", { class: "cell forecast" },
    h("div", { class: "row", style: "padding:0;align-items:center" },
      logo(item.entry.provider),
      h("div", { class: "line" }, who(item.entry), figure(percent(item.entry.used), "used", figureColor(item.entry)))),
    h("div", { class: "headline" }, figure(value, caption, headlineColor(item.plan))),
    timeline(item.plan, item.entry, now));
}

function forecastRow(item) {
  const entry = item.entry;
  const value = item.plan.kind === "lasts"
    ? figure(`~${Math.round(entry.projected)}%`, `by ${clock(item.plan.reset)}`, "var(--label)")
    : h("span", { class: "unknown", text: `Resets ${clock(item.plan.reset)}` });
  return h("div", { class: "row" },
    logo(entry.provider),
    h("div", null, h("div", { class: "line" }, who(entry), value), bar(entry)));
}

function forecastPanel(feed, now) {
  const order = { short: 0, out: 1, lasts: 2, reset: 3 };
  const items = feed.windows
    .filter((entry) => entry.used !== null)
    .map((entry) => ({ entry, plan: forecast(entry, now) }))
    .filter((item) => item.plan !== null)
    .sort((a, b) => order[a.plan.kind] - order[b.plan.kind]);
  const forecasted = new Set(items.map((item) => item.entry.provider));
  const unlimited = [...new Set(feed.windows
    .filter((entry) => entry.used === null && !forecasted.has(entry.provider))
    .map((entry) => providerName(entry.provider)))];
  const tight = items.filter((item) => item.plan.kind === "short" || item.plan.kind === "out");
  const steady = items.filter((item) => !tight.includes(item));
  const nodes = tight.map((item) => forecastCell(item, now));
  if (!items.length) nodes.push(emptyCell("No resets to forecast yet", "Forecasts need a known limit and reset time."));
  if (steady.length) {
    nodes.push(h("h2", { text: "Lasts until reset", style: tight.length ? "" : "margin-top:16px" }));
    nodes.push(h("div", { class: "list" }, ...steady.map((item) => forecastRow(item))));
  }
  if (unlimited.length) {
    const names = unlimited.length > 1 ? `${unlimited.slice(0, -1).join(", ")} and ${unlimited[unlimited.length - 1]}` : unlimited[0];
    nodes.push(h("p", { class: "note", text: `${names} ${unlimited.length > 1 ? "don't" : "doesn't"} report a limit, so there's nothing to forecast.` }));
  }
  return nodes;
}

function sessionRow(record, now) {
  const facts = [modelName(record.model), record.title ? record.project : null].filter(Boolean);
  return h("div", { class: "row session" },
    logo(record.provider),
    h("div", { style: "min-width:0" },
      h("div", { class: "line" },
        h("span", { class: "topic", text: record.title || record.project || "Untitled session" }),
        h("time", { class: "age", datetime: new Date(record.at_ms).toISOString(), title: new Date(record.at_ms).toLocaleString(), text: age(now - record.at_ms) })),
      h("div", { class: "detail" },
        h("div", { class: "facts" }, ...facts.map((fact) => h("span", { text: fact }))),
        record.tokens !== null ? h("span", { class: "tokens", text: tokens(record.tokens) }) : null)));
}

function recentPanel(feed, now) {
  if (!feed.recent.length) return [emptyCell("No sessions in the last 7 days", null)];
  const seen = new Set();
  const latest = [];
  const earlier = [];
  for (const record of feed.recent) {
    const key = `${record.provider}/${record.model}`;
    if (seen.has(key)) earlier.push(record);
    else {
      seen.add(key);
      latest.push(record);
    }
  }
  return [
    h("h2", { text: "Latest per model", style: "margin-top:16px" }),
    h("div", { class: "list" }, ...latest.map((record) => sessionRow(record, now))),
    earlier.length ? h("h2", { text: "Earlier" }) : null,
    earlier.length ? h("div", { class: "list" }, ...earlier.map((record) => sessionRow(record, now))) : null,
  ];
}

function renderStatus() {
  const node = document.getElementById("status");
  node.replaceChildren();
  node.className = "status";
  if (!state.feed) {
    node.textContent = state.loading ? "Loading" : "";
    return;
  }
  const updated = clock(state.feed.generated_at_ms);
  if (state.offline) {
    node.classList.add("warn");
    node.append(symbol("icon-offline", "", null), `Offline · updated ${updated}`);
    return;
  }
  if (Date.now() - state.feed.generated_at_ms > STALE_MS) node.classList.add("warn");
  node.textContent = `Updated ${updated}`;
}

function renderPanels() {
  const sections = {
    now: document.getElementById("view-now"),
    forecast: document.getElementById("view-forecast"),
    recent: document.getElementById("view-recent"),
  };
  if (!state.feed) {
    for (const section of Object.values(sections)) section.replaceChildren();
    const target = sections[currentView()];
    if (state.loading) {
      target.append(h("div", { class: "loading" }, symbol("icon-spinner", "", null), "Loading usage"));
    } else if (state.failure) {
      const retry = h("button", { class: "action", type: "button", text: "Try again" });
      retry.addEventListener("click", () => refresh());
      target.append(h("div", { class: "cell empty" },
        h("strong", { text: "Can't reach openclaw" }),
        h("p", { text: state.failure }),
        retry));
    }
    return;
  }
  const now = Date.now();
  sections.now.replaceChildren(...nowPanel(state.feed, now).filter(Boolean));
  sections.forecast.replaceChildren(...forecastPanel(state.feed, now).filter(Boolean));
  sections.recent.replaceChildren(...recentPanel(state.feed, now).filter(Boolean));
}

function render() {
  renderStatus();
  renderPanels();
  document.getElementById("refresh").setAttribute("aria-busy", String(state.loading));
}

function currentView() {
  const name = location.hash.slice(1);
  return VIEWS.includes(name) ? name : "now";
}

function applyView() {
  const active = currentView();
  for (const view of VIEWS) {
    document.getElementById(`view-${view}`).hidden = view !== active;
    const tab = document.getElementById(`tab-${view}`);
    if (view === active) tab.setAttribute("aria-current", "page");
    else tab.removeAttribute("aria-current");
  }
  if (!state.feed) renderPanels();
}

function valid(feed) {
  return Boolean(feed) && feed.schema === 2 && typeof feed.generated_at_ms === "number"
    && Array.isArray(feed.windows) && Array.isArray(feed.recent);
}

function readCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (raw === null) return null;
    const feed = JSON.parse(raw);
    return valid(feed) ? feed : null;
  } catch (error) {
    console.error(error);
    return null;
  }
}

function writeCache(feed) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(feed));
  } catch (error) {
    console.error(error);
  }
}

class FeedError extends Error {}

async function fetchFeed() {
  const response = await fetch(`widget.json?t=${Date.now()}`, { cache: "no-store", signal: AbortSignal.timeout(FETCH_TIMEOUT_MS) });
  if (!response.ok) throw new FeedError(`The server answered HTTP ${response.status}.`);
  const feed = await response.json();
  if (!valid(feed)) throw new FeedError("The usage feed is missing windows or recent activity.");
  return feed;
}

function failureText(error) {
  if (error instanceof FeedError) return error.message;
  if (error instanceof SyntaxError) return "The usage feed isn't valid JSON.";
  return "Check that Tailscale is connected.";
}

async function refresh() {
  if (state.loading) return;
  state.loading = true;
  render();
  const started = Date.now();
  try {
    const feed = await fetchFeed();
    state.feed = feed;
    state.offline = false;
    state.failure = null;
    writeCache(feed);
  } catch (error) {
    console.error(error);
    state.offline = state.feed !== null;
    state.failure = failureText(error);
  }
  const settle = 450 - (Date.now() - started);
  if (settle > 0) await new Promise((resolve) => setTimeout(resolve, settle));
  state.loading = false;
  render();
}

const pull = document.getElementById("pull");
const spinnerTicks = () => pull.querySelectorAll(".tick");
let pullStart = null;
let pullDistance = 0;

function setPull(distance) {
  pullDistance = distance;
  pull.style.height = `${distance}px`;
  const shown = Math.round(Math.min(distance / PULL_TRIGGER, 1) * 8);
  spinnerTicks().forEach((tick, index) => { tick.style.opacity = index < shown ? "" : "0"; });
}

async function pullRefresh() {
  pull.classList.add("settle", "refreshing");
  setPull(56);
  spinnerTicks().forEach((tick) => { tick.style.opacity = ""; });
  await refresh();
  pull.classList.remove("refreshing");
  setPull(0);
}

window.addEventListener("touchstart", (event) => {
  if (window.scrollY > 0 || state.loading || event.touches.length !== 1) return;
  pull.classList.remove("settle");
  pullStart = event.touches[0].clientY;
}, { passive: true });

window.addEventListener("touchmove", (event) => {
  if (pullStart === null) return;
  const delta = event.touches[0].clientY - pullStart;
  if (delta <= 0 || window.scrollY > 0) {
    if (pullDistance) setPull(0);
    return;
  }
  event.preventDefault();
  setPull(Math.min(PULL_MAX, delta * 0.55));
}, { passive: false });

function endPull(completed) {
  if (pullStart === null) return;
  pullStart = null;
  if (completed && pullDistance >= PULL_TRIGGER) {
    pullRefresh();
    return;
  }
  pull.classList.add("settle");
  setPull(0);
}

window.addEventListener("touchend", () => endPull(true));
window.addEventListener("touchcancel", () => endPull(false));

document.getElementById("refresh").addEventListener("click", () => refresh());
window.addEventListener("hashchange", applyView);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.feed && Date.now() - state.feed.generated_at_ms > POLL_MS) refresh();
});
setInterval(() => {
  if (document.visibilityState === "visible") refresh();
}, POLL_MS);

state.feed = readCache();
applyView();
render();
refresh();
</script>
</body>
</html>
