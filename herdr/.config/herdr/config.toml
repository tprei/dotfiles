onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
sidebar_bg = "#1d2021"
active_row_bg = "#3c3836"
selection_bg = "#504945"
accent = "#fe8019"

[terminal]
default_shell = "/bin/zsh"
shell_mode = "non_login"

[keys]
prefix = "ctrl+a"
split_vertical = ["prefix+v", "prefix+minus", "alt+minus"]
split_horizontal = ["prefix+=", "alt+="]
help = ["prefix+?", "alt+?", "alt+shift+/"]
copy_mode = ["prefix+[", "alt+]", "alt+}", "alt+{", "alt+shift+[", "alt+shift+]"]
next_tab = ["prefix+n", "alt+n", "alt+j"]
previous_tab = ["prefix+p", "alt+p", "alt+k"]
close_pane = "prefix+x"
close_tab = ["prefix+shift+x", "alt+x"]
close_workspace = ["prefix+shift+d", "alt+shift+x"]
edit_scrollback = ["prefix+e", "alt+e"]
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
detach = ["prefix+q", "prefix+d"]
workspace_picker = ["prefix+w", "prefix+s", "alt+shift+w"]
goto = ["prefix+g", "alt+g", "alt+w"]
open_notification_target = ["prefix+o", "alt+o"]
rename_workspace = ["prefix+shift+w", "alt+shift+r"]
rename_tab = ["prefix+shift+t", "prefix+comma", "alt+r"]
next_workspace = ["alt+shift+n", "alt+shift+j"]
previous_workspace = ["alt+shift+p", "alt+shift+k"]
new_workspace = ["prefix+shift+n", "alt+shift+c"]
new_worktree = ["prefix+shift+g", "alt+shift+g"]
switch_workspace = "alt+shift+1..9"
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
new_tab = ["prefix+c", "alt+c"]
zoom = ["prefix+z", "alt+z"]
toggle_sidebar = ["prefix+b", "alt+f"]
settings = "prefix+shift+s"
move_tab_previous = ["prefix+shift+left", "ctrl+shift+left"]
move_tab_next = ["prefix+shift+right", "ctrl+shift+right"]
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
swap_pane_left = ["prefix+shift+h", "alt+left"]
swap_pane_right = ["prefix+shift+l", "alt+right"]
resize_pane_left = "alt+h"
resize_pane_right = "alt+l"
last_pane = "prefix+semicolon"
cycle_pane_next = ""
switch_tab = "alt+1..9"
focus_agent = "ctrl+alt+1..9"

[[keys.command]]
key = "alt+shift+e"
type = "shell"
command = "~/.config/herdr/scripts/open-pane-dir.sh"

[[keys.command]]
key = "prefix+ctrl+s"
type = "shell"
command = "~/.config/herdr/scripts/checkpoint.sh"
description = "save session checkpoint"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "python3 ~/.config/herdr/scripts/navigate.py left"
description = "focus pane left, or send ctrl+h to vim, fzf, or ssh"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "python3 ~/.config/herdr/scripts/navigate.py down"
description = "focus pane down, or send ctrl+j to vim, fzf, or ssh"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "python3 ~/.config/herdr/scripts/navigate.py up"
description = "focus pane up, or send ctrl+k to vim, fzf, or ssh"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "python3 ~/.config/herdr/scripts/navigate.py right"
description = "focus pane right, or send ctrl+l to vim, fzf, or ssh"

[[keys.command]]
key = "prefix+tab"
type = "popup"
command = "python3 ~/.config/herdr/extrakto/extract.py"
description = "extract text from pane output"
width = "90%"
height = "80%"

[[keys.command]]
key = "alt+shift+period"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

[[keys.command]]
key = "alt+>"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

[ui]
tab_bar_position = "bottom"
prompt_new_tab_name = false
copy_on_select = false
prompt_new_workspace_name = true
hide_tab_bar_when_single_tab = true
window_title = "{workspace} · {tab}"
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "~/.config/herdr/scripts/checkpoint-status.sh", interval_seconds = 1, timeout_seconds = 2 },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

agent_panel_scope = "all"
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "machine", fg = "#83a598", rules = [{ equals = "Local", fg = "#928374" }] }, { token = "workspace", bold = true }, { token = "tab", dim = true }],
  [{ token = "agent", fg = "#fabd2f" }, { token = "terminal_title_stripped", dim = true }],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", bold = true }],
  [{ token = "branch", fg = "#8ec07c" }, "git_status"],
]

[ui.toast]
delivery = "herdr"

[experimental]
pane_history = false

[ui.sound]
enabled = false
