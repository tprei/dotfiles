# zsh is my default shell
set -g default-shell /bin/zsh
# non-login interactive shell per pane (skips re-sourcing /etc/profile on every split)
set -g default-command "${SHELL}"

# panes theming
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# terminal and clipboard
set -g default-terminal "tmux-256color"

# WSL/Alacritty currently reports xterm-256color outside tmux
set -as terminal-features ",xterm-256color:RGB:sync"

set -g mouse on 
# focus-events is ON (forced by tmux-sensible, loaded below) — enables nvim
# FocusGained/autoread. No redraw corruption observed with it on. To force it
# off, set it AFTER `run tpm` (sensible re-enables it otherwise).
set -g set-clipboard on

# Keep this off while avoiding Alacritty/WSL redraw corruption
set -g allow-passthrough on

# Extended key reporting can corrupt redraws/statuslines on some terminal/tmux/app combos
set -s extended-keys off

# disable noisy terminal alerts
set -g bell-action any
set -g visual-bell off

# general options
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off


# make C-a the prefix, and make C-a C-a send C-a through
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# optional: make C-b pass through to programs
bind-key -n C-b send-prefix

# splits keep the current working directory
bind - split-window -h -c "#{pane_current_path}"
bind = split-window -v -c "#{pane_current_path}"

bind M-- split-window -h -c "#{pane_current_path}"
bind M-= split-window -v -c "#{pane_current_path}"

unbind %


# vi copy mode (enter via prefix [ ; M-[ removed: ESC [ is the CSI introducer
# and collided with incoming escape sequences, causing phantom copy-mode entries)
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection

bind -T copy-mode-vi    MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-emacs MouseDragEnd1Pane send -X copy-selection-no-clear


# escape-time 0: no lag on nested escape sequences (tmux-over-tmux, vim)
set -s escape-time 0
set -g repeat-time 500

# windows
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# bind alt-w to choose window selector
bind-key -n M-w choose-session

# Use alt-number to go to window (base-index 1, so windows start at 1)
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5

# move between windows with alt-n/p
bind -n M-p previous-window

bind -n M-n next-window

# pane resizing (pane navigation is handled by vim-tmux-navigator below)
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

bind -n M-Left swap-pane -U

bind -n M-Right swap-pane -D

# alt-x to kill pane
bind -n M-x confirm-before -p "kill pane? (y/n)" kill-pane

# -------------------------------------------------------------------
# Alt+SHIFT = the same root binding, one level IN.
# The outer session owns every bare M-* key, so a nested tmux (local
# `tmux`, or a remote one behind ssh/mosh) never sees them. Each shifted
# variant below forwards the UNSHIFTED key into the pane instead, so the
# inner tmux — running this same config — executes it. Exactly one level:
# the inner tmux handles M-n itself rather than forwarding again.
# When the pane is not a nested session the shifted key just does the
# local action, so Alt+Shift is always safe to press.
# Format check (no shell fork) mirrors @vim_navigator_check.
# Digits assume a US layout: Alt+Shift+1..5 arrive as M-! M-@ M-# M-$ M-%.
# Not shifted, on purpose:
#   M-t / F12  the passthrough toggle must stay outer-local; once the outer
#              is OFF every key including F12 reaches the inner anyway.
#   M-[        unbound here (ESC [ is the CSI introducer); use C-a C-a [.
# Prefix-table alt keys (M-- M-= splits, prefix M-1..5 layouts, prefix
# M-Up/Down/Left/Right resize) need nothing: C-a C-a sends the prefix on, so
# C-a C-a M-- splits the inner session. That only breaks for prefix keys the
# outer also owns in the root table, and those are exactly the keys shifted
# below — C-a C-a M-! reaches the inner's prefix M-1 (select-layout).
# -------------------------------------------------------------------

set -g @in_nested '#{m/ri:^(ssh|mosh-client|tmux)$,#{pane_current_command}}'

bind -n M-N if-shell -F '#{E:@in_nested}' 'send-keys M-n' 'next-window'
bind -n M-P if-shell -F '#{E:@in_nested}' 'send-keys M-p' 'previous-window'
bind -n M-W if-shell -F '#{E:@in_nested}' 'send-keys M-w' 'choose-session'

bind -n 'M-!' if-shell -F '#{E:@in_nested}' 'send-keys M-1' 'select-window -t 1'
bind -n 'M-@' if-shell -F '#{E:@in_nested}' 'send-keys M-2' 'select-window -t 2'
bind -n 'M-#' if-shell -F '#{E:@in_nested}' 'send-keys M-3' 'select-window -t 3'
bind -n 'M-$' if-shell -F '#{E:@in_nested}' 'send-keys M-4' 'select-window -t 4'
bind -n 'M-%' if-shell -F '#{E:@in_nested}' 'send-keys M-5' 'select-window -t 5'

bind -n M-H if-shell -F '#{E:@in_nested}' 'send-keys M-h' 'resize-pane -L 5'
bind -n M-J if-shell -F '#{E:@in_nested}' 'send-keys M-j' 'resize-pane -D 5'
bind -n M-K if-shell -F '#{E:@in_nested}' 'send-keys M-k' 'resize-pane -U 5'
bind -n M-L if-shell -F '#{E:@in_nested}' 'send-keys M-l' 'resize-pane -R 5'

bind -n M-S-Left  if-shell -F '#{E:@in_nested}' 'send-keys M-Left'  'swap-pane -U'
bind -n M-S-Right if-shell -F '#{E:@in_nested}' 'send-keys M-Right' 'swap-pane -D'

bind -n M-X if-shell -F '#{E:@in_nested}' 'send-keys M-x' 'confirm-before -p "kill pane? (y/n)" kill-pane'
bind b break-pane

# Outer-session pane navigation under the prefix. Bare C-h/j/k/l go to the
# innermost session (vim-tmux-navigator treats ssh/mosh/tmux panes as vim);
# these move between panes of THIS session. prefix C-l stays clear-screen
# (restored by the plugin), so right-nav under the prefix is intentionally omitted.
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U

# platform helpers. The command lives in a user option so the Alt+Shift
# variant below can reuse it without duplicating the quoting.
if-shell 'uname -s | grep -q Darwin' {
    set -g @alt_e_cmd 'open "#{pane_current_path}"'
    set -g @alt_v_cmd 'tmux display-message "tmux-paste-image is WSL-only"'

} {

    set -g @alt_e_cmd 'explorer.exe "$(wslpath -w "#{pane_current_path}")" 2>/dev/null || true'
    set -g @alt_v_cmd '~/dotfiles/tmux/scripts/tmux-paste-image.sh #{pane_id}'
}

bind -n M-e run-shell '#{E:@alt_e_cmd}'
bind -n M-v run-shell '#{E:@alt_v_cmd}'

bind -n M-E if-shell -F '#{E:@in_nested}' 'send-keys M-e' "run-shell '#{E:@alt_e_cmd}'"
bind -n M-V if-shell -F '#{E:@in_nested}' 'send-keys M-v' "run-shell '#{E:@alt_v_cmd}'"

# -------------------------------------------------------------------
# Nested tmux full-passthrough toggle: F12 or M-t (left-hand-only alt)
# Either key switches the OUTER session's key table to one containing
# only the toggle keys, so every other key — C-a prefix, M-* root
# bindings, mouse — passes through to the inner tmux natively, against
# ANY remote tmux config (stock C-b or this one). Bar greys and shows
# OFF while active. This is the one mechanism that disables root
# bindings (double-prefix can't); press the same key again to restore.
# M-t also covers the case where F12 doesn't reach tmux through
# Alacritty/WSL.
# -------------------------------------------------------------------

bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style 'bg=colour238,fg=colour244' \;\
  if-shell -F '#{?pane_in_mode,1,0}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T root M-t \
  set prefix None \;\
  set key-table off \;\
  set status-style 'bg=colour238,fg=colour244' \;\
  if-shell -F '#{?pane_in_mode,1,0}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

bind -T off M-t \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

# reload config

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind R refresh-client -S \; display-message "tmux display refreshed"

# yank
set -g @yank_with_mouse on
set -g @override_copy_command 'true'


# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Disabled because tmux-oasis was causing Alacritty+WSL status redraw corruption.
# set -g @plugin 'uhs-robert/tmux-oasis'
# set -g @oasis_flavor 'lagoon_dark'
# set -g @oasis_mode_format 'full'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'laktak/extrakto'

# vim-tmux-navigator: explicit C-h/j/k/l, drop the default C-\ binding.
# Custom check matches the FOREGROUND pane command only (not every process on
# the tty), so nav sends to the innermost session when the pane runs vim/ssh/
# mosh/local tmux — without breaking nav in shell panes that merely spawn a
# transient ssh (e.g. git fetch/push, background tunnels). Plugin also restores
# clear-screen as `prefix C-l`.
set -g @vim_navigator_mapping_left "C-h"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_right "C-l"
set -g @vim_navigator_mapping_prev ""
set -g @vim_navigator_check "echo '#{pane_current_command}' | grep -iqE '^(view|l?n?vim?x?|fzf|ssh|mosh-client|tmux)$'"

# resurrect (manual prefix Ctrl-s/Ctrl-r works regardless). continuum auto-save
# needs a #() in status-right, disabled here for redraw safety, so save-interval
# only fires on incidental redraws; restore uses the last saved snapshot.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'


# Foreground (not -b): continuum injects #(...) into status-right at load; the
# set -g status-right below runs AFTER plugins and overwrites it. With -b the
# injection would win and violate the "no shell commands" statusline rule.
run '~/.tmux/plugins/tpm/tpm'


# -------------------------------------------------------------------
# WSL/Alacritty-safe statusline
# No Nerd Font glyphs, no powerline arrows, no shell commands, no clock.
# Looks nicer than default but avoids the redraw corruption.
# -------------------------------------------------------------------


set -g status on
set -g status-position bottom
set -g status-interval 0
set -g status-justify left

set -g status-style 'bg=colour236,fg=colour250'

set -g status-left-length 60
set -g status-right-length 120

# Left: prefix indicator + nested-OFF marker + session name
set -g status-left '#[fg=colour236,bg=colour110,bold] #{?client_prefix,PREFIX,TMUX} #{?#{==:#{client_key_table},off},[OFF] ,}#[fg=colour250,bg=colour238,nobold] #S #[default] '


# Window list
set -g window-status-separator ' '

set -g window-status-format '#[fg=colour244,bg=colour236] #I:#W#F '

set -g window-status-current-format '#[fg=colour236,bg=colour150,bold] #I:#W#F #[default]'

# Right: host + current command + current directory basename
set -g status-right '#[fg=colour244]#H #[fg=colour240]| #[fg=colour250]#{pane_current_command} #[fg=colour240]| #[fg=colour250]#{b:pane_current_path} '
